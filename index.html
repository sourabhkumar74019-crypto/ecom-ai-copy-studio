<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce AI Description & Ad Copy Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen p-4 md:p-8 font-sans transition-colors duration-300">

    <div class="max-w-3xl mx-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-6 shadow-xl dark:shadow-2xl transition-colors duration-300">
        
        <!-- Top Bar with Light/Dark Mode Toggle -->
        <div class="flex justify-between items-center mb-6">
            <span class="text-xs font-bold tracking-widest text-emerald-600 dark:text-emerald-400 uppercase">Micro-SaaS Tool #3</span>
            <button onclick="toggleTheme()" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-slate-100 dark:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                <span id="themeIcon">☀️ Light Mode</span>
            </button>
        </div>

        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-600 to-teal-600 dark:from-emerald-400 dark:to-teal-400">
                E-Com Product & Ad Copy AI
            </h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm mt-2">Generate high-converting product descriptions & social ad copies in seconds</p>
        </div>

        <!-- Form Inputs -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase mb-1">Gemini API Key</label>
                <input type="password" id="apiKey" placeholder="Enter your Gemini API Key" 
                    class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-emerald-500 text-slate-900 dark:text-white transition">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase mb-1">Product Name</label>
                    <input type="text" id="productName" placeholder="e.g. Ergonomic Wooden Desk Lamp" 
                        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-emerald-500 text-slate-900 dark:text-white transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase mb-1">Target Audience</label>
                    <input type="text" id="targetAudience" placeholder="e.g. Work-from-home professionals & students" 
                        class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-emerald-500 text-slate-900 dark:text-white transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase mb-1">Key Features / Benefits</label>
                <textarea id="productFeatures" rows="3" placeholder="e.g. Eye-care LED light, touch controls, wireless phone charging base, solid oak finish" 
                    class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-emerald-500 text-slate-900 dark:text-white transition"></textarea>
            </div>

            <button onclick="generateProductCopy()" id="btnText"
                class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 font-bold py-3 rounded-lg shadow-lg transition duration-200 text-white">
                🛍️ Generate Copy & Ad Suite
            </button>
        </div>

        <!-- Output Box -->
        <div id="outputContainer" class="mt-8 hidden">
            <h2 class="text-lg font-bold text-slate-800 dark:text-slate-200 mb-2">Generated E-Commerce Package:</h2>
            <div id="output" class="bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-lg p-4 text-slate-800 dark:text-slate-300 whitespace-pre-wrap text-sm leading-relaxed transition"></div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // Light / Dark Theme Toggle
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.innerText = '🌙 Dark Mode';
            } else {
                html.classList.add('dark');
                icon.innerText = '☀️ Light Mode';
            }
        }

        // Gemini API Call
        async function generateProductCopy() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const name = document.getElementById('productName').value.trim();
            const audience = document.getElementById('targetAudience').value.trim();
            const features = document.getElementById('productFeatures').value.trim();
            const btn = document.getElementById('btnText');
            const outputContainer = document.getElementById('outputContainer');
            const output = document.getElementById('output');

            if (!apiKey || !name || !features) {
                alert('Please enter your Gemini API Key, Product Name, and Features.');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Crafting High-Converting Copy... ⏳';
            outputContainer.classList.remove('hidden');
            output.innerText = 'Analyzing product and target buyers...';

            const promptText = `Act as an expert E-Commerce Copywriter & Performance Marketer. Create a complete sales & ad copy suite for:
            - Product Name: ${name}
            - Target Audience: ${audience}
            - Key Features: ${features}

            Provide output in clean, readable sections:
            1. Engaging Product Title & Tagline
            2. High-Converting Product Description (Hook, Benefits & Call-to-Action)
            3. Key Feature Bullet Points (Benefit-focused)
            4. Facebook/Instagram Ad Copy (Primary Text, Headline, & Hook)
            5. Recommended Target Hashtags`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    output.innerText = data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    output.innerText = 'API Error: ' + data.error.message;
                } else {
                    output.innerText = 'Failed to generate response. Check your API Key.';
                }
            } catch (err) {
                output.innerText = 'Error connecting to Gemini API: ' + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = '🛍️ Generate Copy & Ad Suite';
            }
        }
    </script>
</body>
</html>
